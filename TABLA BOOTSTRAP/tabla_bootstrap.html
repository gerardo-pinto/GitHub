<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla con Bootstrap</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <table class="table table-bordered table-sm w-100">
            <thead class="thead-dark">
                <tr>
                    <th>#</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Edad</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="bg-light">1</td>
                    <td class="bg-warning">Maria</td>
                    <td class="bg-light">Jara</td>
                    <td class="bg-success">15</td>
                </tr>
                <tr>
                    <td class="bg-light">2</td>
                    <td class="bg-warning">Juan</td>
                    <td class="bg-light">Morales</td>
                    <td class="bg-success">3</td>
                </tr>
                <tr>
                    <td class="bg-light">3</td>
                    <td colspan="2" class="bg-warning">Bernarda</td>
                    <td class="bg-success">33</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
