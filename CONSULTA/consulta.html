<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <form action="respuesta.html" method="get" target="_blank" class="needs-validation" novalidate>
            <div class="form-row">
                <div class="form-group col-md-4">
                    <label for="nombre">Nombre</label>
                    <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required>
                    <div class="invalid-feedback">Por favor, ingresa tu nombre.</div>
                </div>
                <div class="form-group col-md-4">
                    <label for="apellido">Apellido</label>
                    <input type="text" class="form-control" id="apellido" name="apellido" placeholder="Ingresa tu apellido" required>
                    <div class="invalid-feedback">Por favor, ingresa tu apellido.</div>
                </div>
                <div class="form-group col-md-4">
                    <label for="username">Nombre de usuario</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text">@</span>
                        </div>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Nombre de usuario" required>
                        <div class="invalid-feedback">Por favor, ingresa tu nombre de usuario.</div>
                    </div>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="ciudad">Ciudad</label>
                    <input type="text" class="form-control" id="ciudad" name="ciudad" placeholder="Ciudad" required>
                    <div class="invalid-feedback">Por favor, ingresa tu ciudad.</div>
                </div>
                <div class="form-group col-md-3">
                    <label for="motivo">Motivo</label>
                    <select class="form-control" id="motivo" name="motivo" required>
                        <option value="">Selecciona un motivo</option>
                        <option value="Deposito">Deposito</option>
                        <option value="Giro">Giro</option>
                        <option value="Consulta de saldo">Consulta de saldo</option>
                    </select>
                    <div class="invalid-feedback">Por favor, selecciona un motivo.</div>
                </div>
            </div>
            <div class="form-group form-check">
                <label for="desear">¿Desea ver la respuesta en pantalla?</label><br>
                <input type="checkbox" class="form-check-input" id="verRespuesta">
                <label class="form-check-label" for="verRespuesta">Si</label>

            </div>
            <button type="submit" class="btn btn-primary">Solicitar</button>
        </form>
    </div>

    <script>
        (function() {
            'use strict';
            window.addEventListener('load', function() {
                var forms = document.getElementsByClassName('needs-validation');
                Array.prototype.filter.call(forms, function(form) {
                    form.addEventListener('submit', function(event) {
                        if (form.checkValidity() === false) {
                            event.preventDefault();
                            event.stopPropagation();
                        }
                        form.classList.add('was-validated');
                    }, false);
                });
            }, false);
        })();
    </script>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
