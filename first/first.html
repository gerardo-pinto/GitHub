<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diseño Responsivo</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="container-fluid">
        <!-- Para pantallas de menos de 500 px -->
        <div class="row d-block d-sm-none">
            <div class="col-12 rosado menu">Menu Principal</div>
            <div class="col-12 verde">2</div>
            <div class="col-12 azul">3</div>
            <div class="col-12 gris">4</div>
        </div>

        <!-- Para pantallas entre 501 px y 750 px -->
        <div class="d-none d-sm-block d-md-none">
            <div class="row">
                <div class="col-12 rosado menu">Menu Principal</div>
            </div>
            <div class="row">
                <div class="col-4 verde">2</div>
                <div class="col-4 azul">3</div>
                <div class="col-4 rojo">4</div>
            </div>
            <div class="row">
                <div class="col-6 morado">5</div>
                <div class="col-6 gris">6</div>
            </div>
        </div>

        <!-- Para pantallas sobre 751 px -->
        <div class="d-none d-md-block">
            <div class="row">
                <div class="col-12 rosado menu">Menu Principal</div>
            </div>
            <div class="row">
                <div class="col-12 verde">2</div>
            </div>
            <div class="row">
                <div class="col-12 azul">3</div>
            </div>
            <div class="row">
                <div class="col-4 rojo">4</div>
                <div class="col-4 morado">5</div>
                <div class="col-4 gris">6</div>
            </div>
        </div>
    </div>

</body>
</html>
